group 'io.paratoner.tesseract_ocr'
version '1.0'

// Patched for LibreScan: the upstream build.gradle (tesseract_ocr 0.5.0 on
// pub.dev) has two problems on current Gradle/AGP, both confirmed by
// actually building this project:
//  1. It called the removed `jcenter()` repository method, which no longer
//     exists in current Gradle. It was never actually needed — the one
//     native dependency this module pulls in (tesseract4android) already
//     resolves from the `jitpack.io` repo listed below.
//  2. Its own `buildscript { dependencies { classpath '...gradle:8.2.1' } }`
//     tried to pull in a whole second, older copy of the Android Gradle
//     Plugin and its transitive dependencies — a pre-centralized-plugin-
//     management pattern that is both unnecessary (the root project's
//     settings.gradle.kts already supplies AGP/Kotlin to every module) and
//     now fails outright because this module's own repository list doesn't
//     carry everything that old AGP's dependency graph needs. Removed; this
//     module now just applies the plugin and gets its version from the
//     root project, like every other Flutter plugin module does.
// See README.md "Vendored dependencies". If upstream publishes a fixed
// release, switch pubspec.yaml's `tesseract_ocr` entry back to a normal
// hosted version constraint and delete this folder.
rootProject.allprojects {
    repositories {
        mavenLocal()
        google()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'io.paratoner.tesseract_ocr'
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 16
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    packagingOptions{
        doNotStrip '*/mips/*.so'
        doNotStrip '*/mips64/*.so'
    }
    // Patched: pin Java/Kotlin compile targets explicitly (matching the app
    // module's JVM 17) so Gradle doesn't pick inconsistent defaults for the
    // Java vs Kotlin compile tasks of this module, which fails the build
    // with "Inconsistent JVM Target Compatibility".
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.8.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-common:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
}
