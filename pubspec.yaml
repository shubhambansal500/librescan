name: librescan
description: >
  LibreScan — a free, open-source, offline document scanner for mobile.
  Capture, crop, enhance, OCR, and export documents to PDF/text. No account,
  no cloud, no ads, no tracking.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # Camera capture
  camera: ^0.12.1

  # Pure-Dart image processing (no native/FFI build risk): perspective warp,
  # grayscale/threshold filters, Sobel-based edge hints.
  image: ^4.12.0

  # PDF generation + print/share preview
  pdf: ^3.13.1
  printing: ^5.15.1

  # On-device, fully offline OCR (wraps Tesseract natively; no network calls).
  # Vendored + patched under third_party/ — see README.md "Vendored dependencies":
  # pub.dev's published 0.5.0 build.gradle calls the removed jcenter() method and
  # fails to build on current Gradle/AGP.
  tesseract_ocr:
    path: third_party/tesseract_ocr_patched

  # State management
  provider: ^6.1.5

  # Storage / sharing / permissions / ids
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  permission_handler: ^13.0.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata/
    - assets/tessdata_config.json

# Run `dart run flutter_launcher_icons` after changing anything here to
# regenerate android/ and ios/ icon assets.
flutter_launcher_icons:
  image_path: "assets/icon/icon_master.png"
  android: true
  adaptive_icon_background: "#3949AB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
